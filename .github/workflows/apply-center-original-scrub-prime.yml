name: Center Original scrub cache prime

on:
  push:
    paths:
      - '.github/center_original_scrub_prime_patch.py'
      - '.github/workflows/apply-center-original-scrub-prime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/center_original_scrub_prime_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Center Original scrub PCM around grab point"
          git push
