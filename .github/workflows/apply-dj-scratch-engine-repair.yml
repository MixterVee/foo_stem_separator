name: Apply DJ scratch engine repair

on:
  push:
    paths:
      - '.github/workflows/apply-dj-scratch-engine-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair DJ scratch engine section
        run: python .github/dj_scratch_engine_repair.py

      - name: Validate diff
        run: git diff --check && git diff -- stem_dsp.cpp

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Repair DJ-style scratch transport section"
          git push
