name: Apply DJ scratch engine migration

on:
  push:
    paths:
      - '.github/workflows/apply-dj-scratch-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply DJ scratch engine patch
        run: python .github/dj_scratch_engine_patch.py

      - name: Show diff
        run: git diff --check && git diff -- stem_dsp.cpp

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Adopt DJ-style continuous scratch engine"
          git push
