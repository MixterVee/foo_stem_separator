name: Apply platter timeline repair

on:
  push:
    paths:
      - '.github/fix_platter_timeline_patch.py'
      - '.github/workflows/apply-fix-platter-timeline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix_platter_timeline_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Fix 48k platter timeline continuity"
          git push
