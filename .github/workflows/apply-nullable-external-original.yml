name: Apply stem-only external transport

on:
  push:
    paths:
      - '.github/nullable_external_original_patch.py'
      - '.github/workflows/apply-nullable-external-original.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/nullable_external_original_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Allow stem-only external transport PCM"
          git push
