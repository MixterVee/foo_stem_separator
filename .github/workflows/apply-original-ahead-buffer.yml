name: Apply Original ahead platter buffer

on:
  push:
    paths:
      - '.github/original_ahead_buffer_patch.py'
      - '.github/workflows/apply-original-ahead-buffer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/original_ahead_buffer_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Keep Original platter cache ahead of playback"
          git push
