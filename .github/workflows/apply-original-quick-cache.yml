name: Apply Original quick cache

on:
  push:
    paths:
      - '.github/original_quick_cache_patch.py'
      - '.github/workflows/apply-original-quick-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/original_quick_cache_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Publish Original scratch PCM in quick cache windows"
          git push
