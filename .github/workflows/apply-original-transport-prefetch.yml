name: Apply Original transport prefetch

on:
  push:
    paths:
      - '.github/original_transport_prefetch_patch.py'
      - '.github/workflows/apply-original-transport-prefetch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/original_transport_prefetch_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Prefetch Original PCM for immediate platter scratch"
          git push
