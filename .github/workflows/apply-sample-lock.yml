name: Apply sample-locked platter renderer

on:
  push:
    paths:
      - '.github/sample_lock_patch.py'
      - '.github/workflows/apply-sample-lock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sample lock patch
        run: python .github/sample_lock_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Sample-lock platter audio to hand position"
          git push
