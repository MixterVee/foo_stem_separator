name: Apply scratch diagnostic overlay

on:
  push:
    paths:
      - '.github/scratch_debug_overlay_patch.py'
      - '.github/workflows/apply-scratch-debug-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scratch_debug_overlay_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Expose live scratch render diagnostics"
          git push
