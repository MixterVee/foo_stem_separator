name: Apply scratch sub-block interpolation

on:
  push:
    paths:
      - '.github/scratch_subblock_patch.py'
      - '.github/workflows/apply-scratch-subblock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scratch_subblock_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Smooth scrub velocity with sub-block interpolation"
          git push
