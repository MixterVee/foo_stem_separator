name: Apply waveform PCM transport cache sharing

on:
  push:
    paths:
      - '.github/workflows/apply-share-waveform-pcm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/share_waveform_pcm_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Share Spectral Waveform PCM with transport cache"
          git push
