name: Apply soft scrub idle

on:
  push:
    paths:
      - '.github/soft_scrub_idle_patch.py'
      - '.github/workflows/apply-soft-scrub-idle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/soft_scrub_idle_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Keep scratch audio queued during hand idle"
          git push
