name: Apply stationary scratch hold fix

on:
  push:
    paths:
      - '.github/workflows/apply-stationary-hold-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stationary hold fix
        run: python .github/stationary_hold_fix.py

      - name: Validate diff
        run: git diff --check && git diff -- stem_dsp.cpp

      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Stop scratch audio when held stationary"
          git push
