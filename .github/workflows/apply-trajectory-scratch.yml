name: Apply trajectory scratch renderer

on:
  push:
    paths:
      - '.github/trajectory_scratch_patch.py'
      - '.github/workflows/apply-trajectory-scratch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply trajectory scratch patch
        run: python .github/trajectory_scratch_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Render scratch from timestamped hand trajectory"
          git push
