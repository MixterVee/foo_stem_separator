name: Apply stem transport engine

on:
  push:
    paths:
      - '.github/workflows/apply-transport.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/transport_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Add stem-safe scrub and reverse transport engine"
          git push
