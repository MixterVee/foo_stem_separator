name: Apply wall-clock scratch trajectory

on:
  push:
    paths:
      - '.github/wallclock_trajectory_patch.py'
      - '.github/workflows/apply-wallclock-trajectory.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply wall-clock trajectory patch
        run: python .github/wallclock_trajectory_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Render scratch from continuous wall-clock trajectory"
          git push
