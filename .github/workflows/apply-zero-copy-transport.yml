name: Apply zero-copy transport renderer

on:
  push:
    paths:
      - '.github/zero_copy_transport_patch.py'
      - '.github/workflows/apply-zero-copy-transport.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/zero_copy_transport_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Make transport renderer use shallow shared segment snapshots"
          git push
