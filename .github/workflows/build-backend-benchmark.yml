name: Build selectable backend benchmark experiment

on:
  workflow_dispatch:
  push:
    branches: [ agent/directml-ab ]
    paths:
      - '.github/workflows/build-backend-benchmark.yml'
      - 'onnx_stem_engine.cpp'
      - 'onnx_stem_engine.h'
      - 'stem_benchmark.cpp'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Record benchmark workflow run id for chat handoff
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\deliverables" | Out-Null
          Set-Content `
            "$env:GITHUB_WORKSPACE\deliverables\backend-benchmark-run-id.txt" `
            "$env:GITHUB_RUN_ID" `
            -Encoding ascii

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/backend-benchmark-run-id.txt

          if (-not (git diff --cached --quiet)) {
            git commit -m "Record backend benchmark workflow run id"
            git push origin HEAD:agent/directml-ab
          }

      - name: Add Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Locate Visual Studio 2022
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -version "[17.0,18.0)" -products * -property installationPath
          if (-not $vsPath) { throw "VS2022 not found." }
          "VS2022_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ATL for VS2022
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $args = @(
            "modify",
            "--installPath", "`"$env:VS2022_PATH`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--quiet",
            "--norestart"
          )
          $p = Start-Process $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "ATL install failed: $($p.ExitCode)"
          }

      - name: Find ATL
        shell: powershell
        run: |
          $atl = Get-ChildItem "$env:VS2022_PATH\VC\Tools\MSVC" -Filter atlbase.h -Recurse |
            Select-Object -First 1
          if (-not $atl) { throw "atlbase.h not found." }
          "ATL_INCLUDE=$($atl.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Install WTL 10.0.10320
        shell: powershell
        run: |
          $packages = "$env:RUNNER_TEMP\packages"
          nuget install wtl -Version 10.0.10320 -OutputDirectory $packages -NonInteractive
          $h = Get-ChildItem $packages -Filter atlapp.h -Recurse | Select-Object -First 1
          if (-not $h) { throw "WTL not found." }
          "WTL_INCLUDE=$($h.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get foobar2000 SDK
        shell: powershell
        run: |
          $sdkRoot = "$env:RUNNER_TEMP\foobar2000-sdk"
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git $sdkRoot
          if (-not (Test-Path $sdkRoot)) { throw "foobar2000 SDK clone failed." }

      - name: Add benchmark source to component build
        shell: powershell
        run: |
          $path = "$env:GITHUB_WORKSPACE\build-ci-v12.ps1"
          $text = Get-Content $path -Raw
          $old = '    "stem_waveform_provider.cpp"'
          $new = $old + ',' + "`r`n" + '    "stem_benchmark.cpp"'

          if (-not $text.Contains($old)) {
            throw "Could not find stem_waveform_provider.cpp in build source list."
          }

          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Build benchmark-enabled component DLL
        shell: powershell
        run: |
          .\build-ci-v12.ps1 `
            -SdkRoot "$env:RUNNER_TEMP\foobar2000-sdk" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -WtlInclude "$env:WTL_INCLUDE" `
            -AtlInclude "$env:ATL_INCLUDE"

      - name: Clone sherpa-onnx 1.13.4 and enable configurable DirectML adapter
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          git clone --depth 1 --branch v1.13.4 https://github.com/k2-fsa/sherpa-onnx.git $src
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx clone failed." }

          $session = Join-Path $src "sherpa-onnx\csrc\session.cc"
          $text = Get-Content $session -Raw

          $pattern = 'int32_t device_id = 0;\r?\n\s*OrtStatus \*status ='
          $replacement = @'
int32_t device_id = 0;
      auto device_it = config.find("device_id");
      if (device_it != config.end()) {
        device_id = ToIntOrDefault(device_it->second, 0);
        config.erase(device_it);
      }
      OrtStatus *status =
'@

          $matches = [regex]::Matches($text, $pattern).Count
          if ($matches -ne 1) {
            throw "Expected exactly one DirectML device-id site; found $matches."
          }

          $text = [regex]::Replace($text, $pattern, $replacement, 1)
          Set-Content -Path $session -Value $text -Encoding UTF8

          Select-String -Path $session -Pattern 'device_it = config.find' -Context 3,7

      - name: Build sherpa-onnx 1.13.4 with DirectML
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          $build = "$env:RUNNER_TEMP\sherpa-directml-build"
          $install = "$env:RUNNER_TEMP\sherpa-directml-install"

          cmake -S $src -B $build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$install" `
            -DBUILD_SHARED_LIBS=ON `
            -DSHERPA_ONNX_ENABLE_DIRECTML=ON `
            -DSHERPA_ONNX_ENABLE_C_API=ON `
            -DSHERPA_ONNX_ENABLE_BINARY=OFF `
            -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF `
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF `
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF `
            -DSHERPA_ONNX_ENABLE_TTS=OFF `
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF `
            -DSHERPA_ONNX_USE_PRE_INSTALLED_ONNXRUNTIME_IF_AVAILABLE=OFF

          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx CMake configure failed." }

          cmake --build $build --config Release --target install -- /m:2
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx DirectML build failed." }

          $dist = "$env:GITHUB_WORKSPACE\dist"
          $dlls = Get-ChildItem $install -Filter *.dll -Recurse
          if (-not $dlls) { throw "No DirectML sherpa runtime DLLs were installed." }

          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName "$dist\$($dll.Name)" -Force
          }

          foreach ($required in @("sherpa-onnx-c-api.dll", "onnxruntime.dll", "DirectML.dll")) {
            if (-not (Test-Path "$dist\$required")) {
              throw "Required DirectML runtime file was not packaged: $required"
            }
          }

          Set-Content "$dist\directml-device0.config" "device_id=0" -Encoding ascii
          Set-Content "$dist\directml-device1.config" "device_id=1" -Encoding ascii

      - name: Download Spleeter ONNX models
        shell: powershell
        run: |
          $archive = "$env:RUNNER_TEMP\spleeter.tar.bz2"
          $extract1 = "$env:RUNNER_TEMP\spleeter-stage1"
          $extract2 = "$env:RUNNER_TEMP\spleeter-stage2"

          Invoke-WebRequest `
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-fp16.tar.bz2" `
            -OutFile $archive

          New-Item -ItemType Directory -Force $extract1,$extract2 | Out-Null
          7z x $archive "-o$extract1" -y
          $tar = Get-ChildItem $extract1 -Filter *.tar | Select-Object -First 1
          if (-not $tar) { throw "Inner Spleeter tar archive not found." }
          7z x $tar.FullName "-o$extract2" -y

          $vocals = Get-ChildItem $extract2 -Filter vocals.fp16.onnx -Recurse |
            Select-Object -First 1
          $accomp = Get-ChildItem $extract2 -Filter accompaniment.fp16.onnx -Recurse |
            Select-Object -First 1

          if (-not $vocals -or -not $accomp) {
            throw "Spleeter model files not found."
          }

          $modelDir = "$env:GITHUB_WORKSPACE\dist\models\spleeter"
          New-Item -ItemType Directory -Force $modelDir | Out-Null
          Copy-Item $vocals.FullName "$modelDir\vocals.fp16.onnx" -Force
          Copy-Item $accomp.FullName "$modelDir\accompaniment.fp16.onnx" -Force

      - name: Add benchmark marker
        shell: powershell
        run: |
          @'
Stem Separator selectable backend benchmark experiment
-----------------------------------------------------
Benchmarks the same 4-second Spleeter block on:
  CPU
  DirectML adapter 0
  DirectML adapter 1

TIME: lower is better.
SPEED vs CPU: higher is better.
The user selects the backend after the benchmark.
The selection is persisted in foobar2000 configuration.
'@ | Set-Content "$env:GITHUB_WORKSPACE\dist\BACKEND-BENCHMARK.txt" -Encoding UTF8

      - name: Create fb2k component package
        shell: powershell
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist"
          $tempZip = "$env:RUNNER_TEMP\foo_stem_separator-backend-benchmark-v1.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $tempZip -Force
          Copy-Item $tempZip "$dist\foo_stem_separator-backend-benchmark-v1.fb2k-component" -Force

      - name: Upload benchmark component
        uses: actions/upload-artifact@v4
        with:
          name: foo_stem_separator-backend-benchmark-v1
          path: dist/**
          if-no-files-found: error
