name: Build universal foobar2000 Stem Separator

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Locate Visual Studio 2022
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -version "[17.0,18.0)" -products * -property installationPath
          if (-not $vsPath) { throw "VS2022 not found." }
          "VS2022_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ATL for VS2022
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $args = @(
            "modify",
            "--installPath", "`"$env:VS2022_PATH`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--quiet",
            "--norestart"
          )
          $p = Start-Process $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "ATL install failed: $($p.ExitCode)"
          }

      - name: Find ATL
        shell: powershell
        run: |
          $atl = Get-ChildItem "$env:VS2022_PATH\VC\Tools\MSVC" -Filter atlbase.h -Recurse | Select-Object -First 1
          if (-not $atl) { throw "atlbase.h not found." }
          "ATL_INCLUDE=$($atl.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Install WTL 10.0.10320
        shell: powershell
        run: |
          $packages = "$env:RUNNER_TEMP\packages"
          nuget install wtl -Version 10.0.10320 -OutputDirectory $packages -NonInteractive
          $h = Get-ChildItem $packages -Filter atlapp.h -Recurse | Select-Object -First 1
          if (-not $h) { throw "WTL not found." }
          "WTL_INCLUDE=$($h.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get foobar2000 SDKs
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git "$env:RUNNER_TEMP\foobar2000-sdk-x64"
          if ($LASTEXITCODE -ne 0) { throw "x64 SDK clone failed." }
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git "$env:RUNNER_TEMP\foobar2000-sdk-x86"
          if ($LASTEXITCODE -ne 0) { throw "x86 SDK clone failed." }

      - name: Build Stem Separator component x64
        shell: powershell
        run: |
          .\build-ci-v12.ps1 `
            -SdkRoot "$env:RUNNER_TEMP\foobar2000-sdk-x64" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -WtlInclude "$env:WTL_INCLUDE" `
            -AtlInclude "$env:ATL_INCLUDE" `
            -Platform x64
          if (!(Test-Path "dist\foo_stem_separator.dll")) { throw "x64 component DLL not found." }
          New-Item -ItemType Directory -Force "arch\x64" | Out-Null
          Copy-Item "dist\foo_stem_separator.dll" "arch\x64\foo_stem_separator.dll" -Force

      - name: Build Stem Separator component Win32
        shell: powershell
        run: |
          .\build-ci-v12.ps1 `
            -SdkRoot "$env:RUNNER_TEMP\foobar2000-sdk-x86" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -WtlInclude "$env:WTL_INCLUDE" `
            -AtlInclude "$env:ATL_INCLUDE" `
            -Platform Win32
          if (!(Test-Path "dist\foo_stem_separator.dll")) { throw "Win32 component DLL not found." }
          New-Item -ItemType Directory -Force "arch\x86" | Out-Null
          Copy-Item "dist\foo_stem_separator.dll" "arch\x86\foo_stem_separator.dll" -Force

      - name: Clone sherpa-onnx and enable configurable DirectML adapter
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          git clone --depth 1 --branch v1.13.4 https://github.com/k2-fsa/sherpa-onnx.git $src
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx clone failed." }
          $session = Join-Path $src "sherpa-onnx\csrc\session.cc"
          $text = Get-Content $session -Raw
          $pattern = 'int32_t device_id = 0;\r?\n\s*OrtStatus \*status ='
          $replacement = "int32_t device_id = 0;`n      auto device_it = config.find(`"device_id`");`n      if (device_it != config.end()) {`n        device_id = ToIntOrDefault(device_it->second, 0);`n        config.erase(device_it);`n      }`n      OrtStatus *status ="
          $matches = [regex]::Matches($text, $pattern).Count
          if ($matches -ne 1) { throw "Expected one DirectML device-id site; found $matches." }
          $text = [regex]::Replace($text, $pattern, $replacement, 1)
          Set-Content -Path $session -Value $text -Encoding UTF8

      - name: Build sherpa-onnx x64 with DirectML
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          $build = "$env:RUNNER_TEMP\sherpa-x64-build"
          $install = "$env:RUNNER_TEMP\sherpa-x64-install"
          cmake -S $src -B $build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$install" `
            -DBUILD_SHARED_LIBS=ON `
            -DSHERPA_ONNX_ENABLE_DIRECTML=ON `
            -DSHERPA_ONNX_ENABLE_C_API=ON `
            -DSHERPA_ONNX_ENABLE_BINARY=OFF `
            -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF `
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF `
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF `
            -DSHERPA_ONNX_ENABLE_TTS=OFF `
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF `
            -DSHERPA_ONNX_USE_PRE_INSTALLED_ONNXRUNTIME_IF_AVAILABLE=OFF
          if ($LASTEXITCODE -ne 0) { throw "x64 sherpa configure failed." }
          cmake --build $build --config Release --target install -- /m:2
          if ($LASTEXITCODE -ne 0) { throw "x64 sherpa build failed." }

          New-Item -ItemType Directory -Force "arch\x64" | Out-Null
          $dlls = Get-ChildItem $install -Filter *.dll -Recurse
          if (-not $dlls) { throw "No x64 sherpa runtime DLLs were installed." }
          foreach ($dll in $dlls) { Copy-Item $dll.FullName "arch\x64\$($dll.Name)" -Force }
          foreach ($required in @("sherpa-onnx-c-api.dll", "onnxruntime.dll", "DirectML.dll")) {
            if (-not (Test-Path "arch\x64\$required")) { throw "Missing x64 runtime file: $required" }
          }

      - name: Build sherpa-onnx Win32 CPU runtime
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          $build = "$env:RUNNER_TEMP\sherpa-x86-build"
          $install = "$env:RUNNER_TEMP\sherpa-x86-install"
          cmake -S $src -B $build -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$install" `
            -DBUILD_SHARED_LIBS=ON `
            -DSHERPA_ONNX_ENABLE_DIRECTML=OFF `
            -DSHERPA_ONNX_ENABLE_GPU=OFF `
            -DSHERPA_ONNX_ENABLE_C_API=ON `
            -DSHERPA_ONNX_ENABLE_BINARY=OFF `
            -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF `
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF `
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF `
            -DSHERPA_ONNX_ENABLE_TTS=OFF `
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF `
            -DSHERPA_ONNX_USE_PRE_INSTALLED_ONNXRUNTIME_IF_AVAILABLE=OFF
          if ($LASTEXITCODE -ne 0) { throw "Win32 sherpa configure failed." }
          cmake --build $build --config Release --target install -- /m:2
          if ($LASTEXITCODE -ne 0) { throw "Win32 sherpa build failed." }

          New-Item -ItemType Directory -Force "arch\x86" | Out-Null
          $dlls = Get-ChildItem $install -Filter *.dll -Recurse
          if (-not $dlls) { throw "No Win32 sherpa runtime DLLs were installed." }
          foreach ($dll in $dlls) { Copy-Item $dll.FullName "arch\x86\$($dll.Name)" -Force }
          foreach ($required in @("sherpa-onnx-c-api.dll", "onnxruntime.dll")) {
            if (-not (Test-Path "arch\x86\$required")) { throw "Missing Win32 runtime file: $required" }
          }

      - name: Download shared Spleeter ONNX models
        shell: powershell
        run: |
          $archive = "$env:RUNNER_TEMP\spleeter.tar.bz2"
          $extract1 = "$env:RUNNER_TEMP\spleeter-stage1"
          $extract2 = "$env:RUNNER_TEMP\spleeter-stage2"
          Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-fp16.tar.bz2" -OutFile $archive
          New-Item -ItemType Directory -Force $extract1,$extract2 | Out-Null
          7z x $archive "-o$extract1" -y
          $tar = Get-ChildItem $extract1 -Filter *.tar | Select-Object -First 1
          if (-not $tar) { throw "Inner Spleeter tar archive not found." }
          7z x $tar.FullName "-o$extract2" -y
          $vocals = Get-ChildItem $extract2 -Filter vocals.fp16.onnx -Recurse | Select-Object -First 1
          $accomp = Get-ChildItem $extract2 -Filter accompaniment.fp16.onnx -Recurse | Select-Object -First 1
          if (-not $vocals -or -not $accomp) { throw "Spleeter models not found." }
          New-Item -ItemType Directory -Force "shared-models\spleeter" | Out-Null
          Copy-Item $vocals.FullName "shared-models\spleeter\vocals.fp16.onnx" -Force
          Copy-Item $accomp.FullName "shared-models\spleeter\accompaniment.fp16.onnx" -Force

      - name: Assemble universal fb2k component
        shell: powershell
        run: |
          $stage = "$env:GITHUB_WORKSPACE\package"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage\x64" | Out-Null
          New-Item -ItemType Directory -Force "$stage\models\spleeter" | Out-Null

          # foobar universal layout: Win32 at package root, x64 under x64/.
          Copy-Item "arch\x86\*" $stage -Recurse -Force
          Copy-Item "arch\x64\*" "$stage\x64" -Recurse -Force

          # Large model files are architecture-independent and stored once.
          Copy-Item "shared-models\spleeter\*" "$stage\models\spleeter" -Force

          Set-Content "$stage\BACKENDS.txt" @(
            "Stem Separator 2.8.2 universal x86+x64",
            "x64: CPU + DirectML backends",
            "Win32/x86: CPU ONNX backend",
            "Spleeter two-stem FP16 models are shared between architectures."
          ) -Encoding UTF8

          foreach ($required in @(
            "$stage\foo_stem_separator.dll",
            "$stage\sherpa-onnx-c-api.dll",
            "$stage\onnxruntime.dll",
            "$stage\x64\foo_stem_separator.dll",
            "$stage\x64\sherpa-onnx-c-api.dll",
            "$stage\x64\onnxruntime.dll",
            "$stage\x64\DirectML.dll",
            "$stage\models\spleeter\vocals.fp16.onnx",
            "$stage\models\spleeter\accompaniment.fp16.onnx"
          )) {
            if (!(Test-Path $required)) { throw "Universal package missing: $required" }
          }

          $component = "$env:GITHUB_WORKSPACE\foo_stem_separator.fb2k-component"
          Remove-Item $component -Force -ErrorAction SilentlyContinue

          # Create the archive with explicit POSIX-style entry names.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $fs = [System.IO.File]::Open(
            $component,
            [System.IO.FileMode]::Create,
            [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None)
          try {
            $zip = New-Object System.IO.Compression.ZipArchive(
              $fs,
              [System.IO.Compression.ZipArchiveMode]::Create,
              $false)
            try {
              Get-ChildItem $stage -File -Recurse | Sort-Object FullName | ForEach-Object {
                $relative = $_.FullName.Substring($stage.Length).TrimStart([char]92, [char]47)
                $entryName = $relative.Replace([char]92, [char]47)
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $zip,
                  $_.FullName,
                  $entryName,
                  [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
              }
            } finally {
              $zip.Dispose()
            }
          } finally {
            $fs.Dispose()
          }

          # Verify normalized package paths before upload.
          $check = [System.IO.Compression.ZipFile]::OpenRead($component)
          try {
            $names = @($check.Entries | ForEach-Object { $_.FullName })
            $bad = @($names | Where-Object { $_ -like '*\\*' })
            if ($bad.Count -ne 0) {
              throw "Backslash ZIP entries found: $($bad -join ', ')"
            }
            foreach ($requiredEntry in @(
              "foo_stem_separator.dll",
              "x64/foo_stem_separator.dll",
              "sherpa-onnx-c-api.dll",
              "x64/sherpa-onnx-c-api.dll",
              "onnxruntime.dll",
              "x64/onnxruntime.dll",
              "x64/DirectML.dll",
              "models/spleeter/vocals.fp16.onnx",
              "models/spleeter/accompaniment.fp16.onnx"
            )) {
              if ($names -notcontains $requiredEntry) {
                throw "Missing normalized ZIP entry: $requiredEntry"
              }
            }
          } finally {
            $check.Dispose()
          }

      - name: Upload universal component
        uses: actions/upload-artifact@v4
        with:
          name: foo_stem_separator-2.8.2-universal
          path: foo_stem_separator.fb2k-component
          if-no-files-found: error

      - name: Prepare stable release asset
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          Copy-Item "foo_stem_separator.fb2k-component" "Stem-Separator-2.8.2-Universal-x86-x64.fb2k-component" -Force

      - name: Publish GitHub latest release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.8.2" `
            "Stem-Separator-2.8.2-Universal-x86-x64.fb2k-component" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Stem Separator 2.8.2" `
            --notes "Stable universal Win32/x64 release. x64 supports CPU and DirectML; Win32/x86 uses CPU ONNX. Includes live Original/Vocals/Instrumental/Blend switching, persistent cache, pre-cache, seek-safe playback, WAV/MP3 export, gain matching, and shared Spleeter models. Remember to add Stem Separator (ONNX) to Active DSPs separately in each foobar2000 installation." `
            --latest
