name: Build Stem Separator status overlay test

on:
  workflow_dispatch:
  push:
    branches: [ agent/stem-status-overlay ]
    paths:
      - '.github/workflows/build.yml'
      - 'stem_processing_status_service.h'
      - 'status-overlay-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record run id for chat handoff
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\deliverables" | Out-Null
          Set-Content "$env:GITHUB_WORKSPACE\deliverables\status-overlay-stem-run-id.txt" "$env:GITHUB_RUN_ID" -Encoding ascii
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/status-overlay-stem-run-id.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record stem status overlay test run [skip ci]"
            git push origin HEAD:agent/stem-status-overlay
          }

      - name: Patch live processing status service
        shell: powershell
        run: |
          $nl = [Environment]::NewLine

          $buildPath = "$env:GITHUB_WORKSPACE\build-ci-v12.ps1"
          $build = Get-Content $buildPath -Raw
          if ($build -notmatch 'stem_processing_status_service\.h') {
            $old = '    "stem_transport_service.h"'
            if (-not $build.Contains($old)) { throw "Build header insertion point not found." }
            $build = $build.Replace($old, $old + ',' + $nl + '    "stem_processing_status_service.h"')
            Set-Content $buildPath $build -Encoding UTF8
          }

          $headerPath = "$env:GITHUB_WORKSPACE\onnx_stem_engine.h"
          $header = Get-Content $headerPath -Raw
          if ($header -notmatch 'struct runtime_status') {
            $marker = 'std::wstring backend_name(backend value);'
            if (-not $header.Contains($marker)) { throw "Engine header runtime marker not found." }
            $block = @(
              $marker,
              '',
              'struct runtime_status {',
              '    backend active_backend = backend::selected;',
              '    bool engine_ready = false;',
              '    bool using_fallback = false;',
              '    bool processing = false;',
              '    std::wstring backend_label;',
              '};',
              '',
              'runtime_status current_runtime_status();',
              'bool selected_backend_preference_is_gpu();'
            ) -join $nl
            $header = $header.Replace($marker, $block)
          }
          $accessor = '    const std::wstring& last_error() const noexcept { return m_error; }'
          if ($header -notmatch 'active_backend\(\) const noexcept') {
            if (-not $header.Contains($accessor)) { throw "Engine accessor marker not found." }
            $header = $header.Replace($accessor, @(
              $accessor,
              '    backend active_backend() const noexcept { return m_active_backend; }',
              '    bool using_fallback() const noexcept {',
              '        return m_requested_backend == backend::selected &&',
              '            m_separator != nullptr && m_active_backend == backend::cpu &&',
              '            (is_directml_backend(m_desired_backend) || selected_backend_preference_is_gpu());',
              '    }'
            ) -join $nl)
          }
          Set-Content $headerPath $header -Encoding UTF8

          $cppPath = "$env:GITHUB_WORKSPACE\onnx_stem_engine.cpp"
          $cpp = Get-Content $cppPath -Raw
          if ($cpp -notmatch '#include <atomic>') {
            $cpp = $cpp.Replace('#include <algorithm>', '#include <algorithm>' + $nl + '#include <atomic>')
          }
          if ($cpp -notmatch '#include <mutex>') {
            $cpp = $cpp.Replace('#include <memory>', '#include <memory>' + $nl + '#include <mutex>')
          }

          if ($cpp -notmatch 'g_runtime_processing_count') {
            $marker = 'cfg_int g_backend_ordinal_cfg(g_backend_ordinal_guid, 0);'
            if (-not $cpp.Contains($marker)) { throw "Runtime status global marker not found." }
            $runtime = @(
              $marker,
              '',
              'std::mutex g_runtime_status_mutex;',
              'onnxstem::runtime_status g_runtime_status;',
              'std::atomic<unsigned> g_runtime_processing_count{0};',
              '',
              'void publish_runtime_status(onnxstem::backend active, bool ready, bool fallback) {',
              '    onnxstem::runtime_status next;',
              '    next.active_backend = active;',
              '    next.engine_ready = ready;',
              '    next.using_fallback = fallback;',
              '    next.processing = g_runtime_processing_count.load(std::memory_order_relaxed) != 0;',
              '    if (ready && active != onnxstem::backend::selected) {',
              '        next.backend_label = onnxstem::backend_name(active);',
              '    }',
              '    std::lock_guard<std::mutex> lock(g_runtime_status_mutex);',
              '    g_runtime_status = std::move(next);',
              '}',
              '',
              'class runtime_processing_scope {',
              'public:',
              '    explicit runtime_processing_scope(bool report) : m_report(report) {',
              '        if (m_report) g_runtime_processing_count.fetch_add(1, std::memory_order_relaxed);',
              '    }',
              '    ~runtime_processing_scope() {',
              '        if (m_report) g_runtime_processing_count.fetch_sub(1, std::memory_order_relaxed);',
              '    }',
              'private:',
              '    bool m_report = false;',
              '};'
            ) -join $nl
            $cpp = $cpp.Replace($marker, $runtime)
          }

          if ($cpp -notmatch 'runtime_status current_runtime_status\(\)') {
            $marker = 'struct engine::api {'
            if (-not $cpp.Contains($marker)) { throw "Runtime status function marker not found." }
            $functions = @(
              'runtime_status current_runtime_status() {',
              '    std::lock_guard<std::mutex> lock(g_runtime_status_mutex);',
              '    runtime_status out = g_runtime_status;',
              '    out.processing = g_runtime_processing_count.load(std::memory_order_relaxed) != 0;',
              '    return out;',
              '}',
              '',
              'bool selected_backend_preference_is_gpu() {',
              '    return static_cast<int>(g_backend_kind_cfg.get()) == 1;',
              '}',
              '',
              $marker
            ) -join $nl
            $cpp = $cpp.Replace($marker, $functions)
          }

          $oldInit = '    if (initialize_backend(wanted)) return true;'
          if ($cpp.Contains($oldInit)) {
            $newInit = @(
              '    if (initialize_backend(wanted)) {',
              '        if (m_requested_backend == backend::selected) {',
              '            const bool fallback = wanted == backend::cpu && selected_backend_preference_is_gpu();',
              '            publish_runtime_status(m_active_backend, true, fallback);',
              '        }',
              '        return true;',
              '    }'
            ) -join $nl
            $cpp = $cpp.Replace($oldInit, $newInit)
          }

          $cpuFallback = '        if (initialize_backend(backend::cpu)) {'
          if ($cpp.Contains($cpuFallback) -and $cpp -notmatch 'publish_runtime_status\(m_active_backend, true, true\)') {
            $cpp = $cpp.Replace($cpuFallback, $cpuFallback + $nl + '            publish_runtime_status(m_active_backend, true, true);')
          }

          $processMarker = '    if (!initialize()) return false;'
          if ($cpp.Contains($processMarker) -and $cpp -notmatch 'runtime_processing_scope processing') {
            $cpp = $cpp.Replace($processMarker, $processMarker + $nl + $nl + '    runtime_processing_scope processing(m_requested_backend == backend::selected);')
          }
          Set-Content $cppPath $cpp -Encoding UTF8

          $dspPath = "$env:GITHUB_WORKSPACE\stem_dsp.cpp"
          $dsp = Get-Content $dspPath -Raw
          if ($dsp -notmatch 'stem_processing_status_service\.h') {
            $dsp = $dsp.Replace('#include "stem_transport_service.h"', '#include "stem_transport_service.h"' + $nl + '#include "stem_processing_status_service.h"')
          }
          if ($dsp -notmatch 'stem_processing_status_service::class_guid') {
            $guidMarker = @(
              'FOOGUIDDECL const GUID stem_transport_service::class_guid =',
              '{ 0x3f42b0c7, 0x8df1, 0x4fb9, { 0xa6, 0x7d, 0x21, 0x55, 0x91, 0xc8, 0x43, 0x6e } };'
            ) -join $nl
            if (-not $dsp.Contains($guidMarker)) { throw "Status service GUID insertion point not found." }
            $guidBlock = @(
              $guidMarker,
              '',
              'FOOGUIDDECL const GUID stem_processing_status_service::class_guid =',
              '{ 0x7a9c0b21, 0x10c5, 0x4d31, { 0xa9, 0x2e, 0x64, 0x1b, 0x2f, 0x8c, 0x51, 0x73 } };'
            ) -join $nl
            $dsp = $dsp.Replace($guidMarker, $guidBlock)
          }

          if ($dsp -notmatch 'class stem_processing_status_service_impl') {
            $factoryMarker = @(
              'static service_factory_single_t<stem_transport_service_impl>',
              '    g_stem_transport_service_factory;'
            ) -join $nl
            if (-not $dsp.Contains($factoryMarker)) { throw "Status service factory insertion point not found." }
            $statusImpl = @(
              $factoryMarker,
              '',
              'class stem_processing_status_service_impl : public stem_processing_status_service {',
              'public:',
              '    bool get_status(stem_processing_status& out) override {',
              '        try {',
              '            out = stem_processing_status{};',
              '            out.mode = static_cast<int>(stemmode::get());',
              '            const auto runtime = onnxstem::current_runtime_status();',
              '            out.engine_ready = runtime.engine_ready ? 1 : 0;',
              '            out.processing = runtime.processing ? 1 : 0;',
              '            out.cpu_fallback = runtime.using_fallback ? 1 : 0;',
              '            if (runtime.active_backend == onnxstem::backend::cpu) {',
              '                out.backend_type = stem_processing_backend_cpu;',
              '            } else if (onnxstem::is_directml_backend(runtime.active_backend)) {',
              '                out.backend_type = stem_processing_backend_directml;',
              '                out.adapter_index = onnxstem::directml_adapter_index(runtime.active_backend);',
              '            }',
              '            if (!runtime.backend_label.empty()) {',
              '                wcsncpy_s(out.backend_label, _countof(out.backend_label), runtime.backend_label.c_str(), _TRUNCATE);',
              '            }',
              '            return true;',
              '        } catch (...) {',
              '            return false;',
              '        }',
              '    }',
              '};',
              '',
              'static service_factory_single_t<stem_processing_status_service_impl>',
              '    g_stem_processing_status_service_factory;'
            ) -join $nl
            $dsp = $dsp.Replace($factoryMarker, $statusImpl)
          }
          Set-Content $dspPath $dsp -Encoding UTF8

          Select-String -Path $cppPath -Pattern 'current_runtime_status|runtime_processing_scope|publish_runtime_status' -Context 1,1
          Select-String -Path $dspPath -Pattern 'stem_processing_status_service_impl' -Context 1,2

      - name: Add Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Locate Visual Studio 2022
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -version "[17.0,18.0)" -products * -property installationPath
          if (-not $vsPath) { throw "VS2022 not found." }
          "VS2022_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ATL for VS2022
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $args = @("modify", "--installPath", "`"$env:VS2022_PATH`"", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--quiet", "--norestart")
          $p = Start-Process $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "ATL install failed: $($p.ExitCode)" }

      - name: Find ATL
        shell: powershell
        run: |
          $atl = Get-ChildItem "$env:VS2022_PATH\VC\Tools\MSVC" -Filter atlbase.h -Recurse | Select-Object -First 1
          if (-not $atl) { throw "atlbase.h not found." }
          "ATL_INCLUDE=$($atl.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Install WTL 10.0.10320
        shell: powershell
        run: |
          $packages = "$env:RUNNER_TEMP\packages"
          nuget install wtl -Version 10.0.10320 -OutputDirectory $packages -NonInteractive
          $h = Get-ChildItem $packages -Filter atlapp.h -Recurse | Select-Object -First 1
          if (-not $h) { throw "WTL not found." }
          "WTL_INCLUDE=$($h.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get foobar2000 SDK
        shell: powershell
        run: |
          $sdkRoot = "$env:RUNNER_TEMP\foobar2000-sdk"
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git $sdkRoot
          if (-not (Test-Path $sdkRoot)) { throw "foobar2000 SDK clone failed." }

      - name: Build Stem Separator DLL
        shell: powershell
        run: |
          .\build-ci-v12.ps1 -SdkRoot "$env:RUNNER_TEMP\foobar2000-sdk" -RepoRoot "$env:GITHUB_WORKSPACE" -WtlInclude "$env:WTL_INCLUDE" -AtlInclude "$env:ATL_INCLUDE"

      - name: Clone sherpa-onnx and enable configurable DirectML adapter
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          git clone --depth 1 --branch v1.13.4 https://github.com/k2-fsa/sherpa-onnx.git $src
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx clone failed." }
          $session = Join-Path $src "sherpa-onnx\csrc\session.cc"
          $text = Get-Content $session -Raw
          $pattern = 'int32_t device_id = 0;\r?\n\s*OrtStatus \*status ='
          $replacement = "int32_t device_id = 0;`n      auto device_it = config.find(`"device_id`");`n      if (device_it != config.end()) {`n        device_id = ToIntOrDefault(device_it->second, 0);`n        config.erase(device_it);`n      }`n      OrtStatus *status ="
          if ([regex]::Matches($text, $pattern).Count -ne 1) { throw "DirectML device-id patch site not found." }
          $text = [regex]::Replace($text, $pattern, $replacement, 1)
          Set-Content -Path $session -Value $text -Encoding UTF8

      - name: Build sherpa-onnx 1.13.4 with DirectML
        shell: powershell
        run: |
          $src = "$env:RUNNER_TEMP\sherpa-onnx"
          $build = "$env:RUNNER_TEMP\sherpa-directml-build"
          $install = "$env:RUNNER_TEMP\sherpa-directml-install"
          cmake -S $src -B $build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$install" -DBUILD_SHARED_LIBS=ON -DSHERPA_ONNX_ENABLE_DIRECTML=ON -DSHERPA_ONNX_ENABLE_C_API=ON -DSHERPA_ONNX_ENABLE_BINARY=OFF -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF -DSHERPA_ONNX_ENABLE_TTS=OFF -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF -DSHERPA_ONNX_USE_PRE_INSTALLED_ONNXRUNTIME_IF_AVAILABLE=OFF
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx configure failed." }
          cmake --build $build --config Release --target install -- /m:2
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx build failed." }
          $dist = "$env:GITHUB_WORKSPACE\dist"
          Get-ChildItem $install -Filter *.dll -Recurse | ForEach-Object { Copy-Item $_.FullName "$dist\$($_.Name)" -Force }
          foreach ($required in @("sherpa-onnx-c-api.dll", "onnxruntime.dll", "DirectML.dll")) {
            if (-not (Test-Path "$dist\$required")) { throw "Missing runtime file: $required" }
          }

      - name: Download Spleeter ONNX models
        shell: powershell
        run: |
          $archive = "$env:RUNNER_TEMP\spleeter.tar.bz2"
          $extract1 = "$env:RUNNER_TEMP\spleeter-stage1"
          $extract2 = "$env:RUNNER_TEMP\spleeter-stage2"
          Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-fp16.tar.bz2" -OutFile $archive
          New-Item -ItemType Directory -Force $extract1,$extract2 | Out-Null
          7z x $archive "-o$extract1" -y
          $tar = Get-ChildItem $extract1 -Filter *.tar | Select-Object -First 1
          if (-not $tar) { throw "Inner Spleeter tar archive not found." }
          7z x $tar.FullName "-o$extract2" -y
          $vocals = Get-ChildItem $extract2 -Filter vocals.fp16.onnx -Recurse | Select-Object -First 1
          $accomp = Get-ChildItem $extract2 -Filter accompaniment.fp16.onnx -Recurse | Select-Object -First 1
          if (-not $vocals -or -not $accomp) { throw "Spleeter models not found." }
          $modelDir = "$env:GITHUB_WORKSPACE\dist\models\spleeter"
          New-Item -ItemType Directory -Force $modelDir | Out-Null
          Copy-Item $vocals.FullName "$modelDir\vocals.fp16.onnx" -Force
          Copy-Item $accomp.FullName "$modelDir\accompaniment.fp16.onnx" -Force

      - name: Create status overlay test package
        shell: powershell
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist"
          $tempZip = "$env:RUNNER_TEMP\foo_stem_separator-status-overlay.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $tempZip -Force
          Copy-Item $tempZip "$dist\foo_stem_separator-status-overlay.fb2k-component" -Force

      - name: Upload status overlay test component
        uses: actions/upload-artifact@v4
        with:
          name: foo_stem_separator-status-overlay
          path: dist/**
          if-no-files-found: error
