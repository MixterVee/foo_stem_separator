name: Build foobar2000 component

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Visual Studio 2022 MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Locate Visual Studio 2022
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -version "[17.0,18.0)" -products * -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio 2022 was not found."
          }
          Write-Host "VS2022: $vsPath"
          "VS2022_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ATL for VS2022
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer setup.exe not found."
          }

          $args = @(
            "modify",
            "--installPath", "`"$env:VS2022_PATH`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--quiet",
            "--norestart"
          )

          $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "ATL installation failed with exit code $($p.ExitCode)"
          }

      - name: Verify VS2022 ATL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $atl = Get-ChildItem "$env:VS2022_PATH\VC\Tools\MSVC" `
            -Filter atlbase.h -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $atl) {
            throw "VS2022 atlbase.h not found."
          }

          $atlInclude = $atl.Directory.FullName
          Write-Host "ATL header:"
          Write-Host $atl.FullName
          "ATL_INCLUDE=$atlInclude" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Install WTL 10.0.10320
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $packages = "$env:RUNNER_TEMP\packages"
          New-Item -ItemType Directory -Force $packages | Out-Null

          nuget install wtl `
            -Version 10.0.10320 `
            -OutputDirectory $packages `
            -NonInteractive

          $wtlHeader = Get-ChildItem $packages -Filter atlapp.h -Recurse |
            Select-Object -First 1

          if (-not $wtlHeader) {
            throw "WTL 10.0.10320 atlapp.h was not found."
          }

          $wtlInclude = $wtlHeader.Directory.FullName
          Write-Host "WTL 10.0.10320 include:"
          Write-Host $wtlInclude
          "WTL_INCLUDE=$wtlInclude" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download foobar2000 SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdkUrl = "https://www.foobar2000.org/downloads/SDK-2025-03-07.7z"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "$env:RUNNER_TEMP\foobar2000-sdk.7z"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\foobar2000-sdk" | Out-Null
          7z x "$env:RUNNER_TEMP\foobar2000-sdk.7z" "-o$env:RUNNER_TEMP\foobar2000-sdk" -y

      - name: Prepare and build component
        shell: powershell
        run: |
          .\build-ci-v10.ps1 `
            -SdkRoot "$env:RUNNER_TEMP\foobar2000-sdk" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -WtlInclude "$env:WTL_INCLUDE" `
            -AtlInclude "$env:ATL_INCLUDE"

      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: foo_stem_separator-x64
          path: dist/**
          if-no-files-found: error
