name: Fold tested Stem patches into source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fold:
    if: github.event.head_commit.message == 'Fold tested Stem patches into source'
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested source transforms
        shell: powershell
        run: |
          .\tools\apply_virtual_platter_patch.ps1
          .\tools\apply_latency_reanchor_patch.ps1
          .\tools\apply_fast_stem_start_patch.ps1

      - name: Commit transformed source
        shell: powershell
        run: |
          git config user.name "MixterVee"
          git config user.email "mixtervandal@gmail.com"
          git add stem_dsp.cpp
          git commit -m "Make tested Stem source permanent"
          git push origin HEAD:main
