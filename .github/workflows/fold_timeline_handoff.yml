name: Fold tested stem timeline handoff fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fold_timeline_handoff.yml'

permissions:
  contents: write

jobs:
  fold:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply tested handoff transform
        shell: powershell
        run: .\tools\apply_stem_timeline_handoff_patch.ps1

      - name: Commit permanent source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git commit -m "Make stem timeline handoff fix permanent"
          git push origin HEAD:main
