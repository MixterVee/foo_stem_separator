name: Materialize tested compression source

on:
  push:
    branches: [ agent/persistent-cache-compression ]
    paths: [ materialize-compression-source-trigger.txt ]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply exact tested source transformations
        shell: powershell
        run: |
          python patch-cache-compression-handoff.py
          if ($LASTEXITCODE -ne 0) { throw "Handoff patch failed." }
          python patch-compression-restore-barrier.py
          if ($LASTEXITCODE -ne 0) { throw "Restore barrier patch failed." }

      - name: Commit materialized tested DSP source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_dsp.cpp
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Materialize tested compressed-cache handoff source [skip ci]"
            git push origin HEAD:agent/persistent-cache-compression
          }
