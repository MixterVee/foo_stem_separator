name: Promote tested Auto Fastest source temp

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/promote-auto-fastest-source-temp.yml'
      - 'promote-auto-fastest-main-trigger.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-2022
    steps:
      - name: Checkout tested Auto Fastest branch
        uses: actions/checkout@v4
        with:
          ref: agent/auto-fastest-backend
          fetch-depth: 1

      - name: Record promotion run id
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force deliverables | Out-Null
          Set-Content deliverables\auto-fastest-promotion-run-id.txt "$env:GITHUB_RUN_ID" -Encoding ascii
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/auto-fastest-promotion-run-id.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record Auto Fastest promotion run [skip ci]"
            git push origin HEAD:agent/auto-fastest-backend
          }

      - name: Materialize tested Auto Fastest patch
        shell: powershell
        run: |
          .\patch-auto-fastest.ps1

      - name: Commit tested Auto Fastest implementation
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onnx_stem_engine.h onnx_stem_engine.cpp stem_benchmark.cpp
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Make Auto Fastest backend source permanent [skip ci]"
            git push origin HEAD:agent/auto-fastest-backend
          }
