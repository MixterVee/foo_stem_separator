name: Promote Automatic Gain Matching Stable

on:
  push:
    branches: [ main ]
    paths:
      - promote-auto-gain.txt

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact user-tested Automatic Gain Matching patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/auto-gain-v1
          git show origin/agent/auto-gain-v1:patch-auto-gain-v1.py > patch-auto-gain-v1.py
          python patch-auto-gain-v1.py
          python - <<'PY'
          from pathlib import Path
          p = Path('foo_stem_separator.cpp')
          s = p.read_text(encoding='utf-8')
          old = '"2.8.0-test1 Automatic Gain Matching",'
          new = '"2.8.0 Stable Automatic Gain Matching",'
          if old not in s:
              raise SystemExit('Expected test version metadata not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f patch-auto-gain-v1.py
          rm -f promote-auto-gain.txt
          rm -f .github/workflows/promote-auto-gain-stable.yml

      - name: Commit stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote tested Automatic Gain Matching to stable"
          git push origin HEAD:main
