name: Promote Cache Settings Stable

on:
  push:
    branches: [ main ]
    paths: [ promote-cache-settings.txt ]

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tested patch scripts
        shell: pwsh
        run: |
          git fetch origin agent/cache-settings
          git show origin/agent/cache-settings:patch-cache-settings.py | Set-Content patch-cache-settings.py -Encoding UTF8
          git show origin/agent/cache-settings:patch-cache-settings-compilefix.py | Set-Content patch-cache-settings-compilefix.py -Encoding UTF8
          git show origin/agent/cache-settings:patch-cache-settings-configsplit.py | Set-Content patch-cache-settings-configsplit.py -Encoding UTF8

      - name: Apply tested Cache Settings patch
        shell: pwsh
        run: |
          python .\patch-cache-settings.py
          if ($LASTEXITCODE -ne 0) { throw "Cache Settings patch failed." }
          python .\patch-cache-settings-compilefix.py
          if ($LASTEXITCODE -ne 0) { throw "Cache Settings compile fix failed." }
          python .\patch-cache-settings-configsplit.py
          if ($LASTEXITCODE -ne 0) { throw "Cache Settings config split failed." }

      - name: Commit stable source and remove temporary promotion files
        shell: pwsh
        run: |
          Remove-Item patch-cache-settings.py,patch-cache-settings-compilefix.py,patch-cache-settings-configsplit.py -Force
          Remove-Item .github\workflows\build-cache-settings-temp.yml -Force -ErrorAction SilentlyContinue
          Remove-Item cache-settings-main-trigger.txt -Force -ErrorAction SilentlyContinue
          Remove-Item promote-cache-settings.txt -Force -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\promote-cache-settings-stable.yml -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Promote tested cache settings to stable"
          git push origin HEAD:main
