name: Promote Stem Blend Stable

on:
  push:
    branches: [ main ]
    paths:
      - promote-stem-blend.txt

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested Stem Blend patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/stem-blend-v1
          git show origin/agent/stem-blend-v1:patch-stem-blend-v1.py > patch-stem-blend-v1.py
          python patch-stem-blend-v1.py
          python - <<'PY'
          from pathlib import Path
          p = Path('foo_stem_separator.cpp')
          s = p.read_text(encoding='utf-8')
          old = '"2.7.0-test1 Stem Blend",'
          new = '"2.7.0 Stable Stem Blend",'
          if old not in s:
              raise SystemExit('Expected test version metadata not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f patch-stem-blend-v1.py
          rm -f promote-stem-blend.txt
          rm -f .github/workflows/promote-stem-blend-stable.yml

      - name: Commit stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote tested Stem Blend to stable"
          git push origin HEAD:main
