name: Publish DirectML adapter deliverable

on:
  workflow_dispatch:
  push:
    branches: [ agent/directml-ab ]
    paths:
      - '.github/workflows/publish-directml-deliverable.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Find latest successful NVIDIA adapter build
        id: find
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh run list `
            --repo "${{ github.repository }}" `
            --workflow build-directml-nvidia.yml `
            --branch agent/directml-ab `
            --status success `
            --limit 1 `
            --json databaseId,headSha,createdAt

          $run = $json | ConvertFrom-Json | Select-Object -First 1
          if (-not $run) { throw "No successful NVIDIA adapter build was found." }
          Write-Host "Using workflow run $($run.databaseId), commit $($run.headSha)"
          "run_id=$($run.databaseId)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download finished fb2k artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = "$env:RUNNER_TEMP\directml-artifact"
          New-Item -ItemType Directory -Force $download | Out-Null
          gh run download "${{ steps.find.outputs.run_id }}" `
            --repo "${{ github.repository }}" `
            --name foo_stem_separator-directml-adapter1-v2 `
            --dir $download
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed." }

          $component = Get-ChildItem $download -Filter *.fb2k-component -Recurse |
            Where-Object { $_.Name -eq 'foo_stem_separator-directml-adapter1.fb2k-component' } |
            Select-Object -First 1
          if (-not $component) { throw "Finished fb2k component was not found in the artifact." }

          $destDir = "$env:GITHUB_WORKSPACE\deliverables"
          New-Item -ItemType Directory -Force $destDir | Out-Null
          Copy-Item $component.FullName "$destDir\foo_stem_separator-directml-adapter1.fb2k-component" -Force

      - name: Commit deliverable to experimental branch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/foo_stem_separator-directml-adapter1.fb2k-component
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Deliverable already matches the latest successful build."
            exit 0
          }
          git commit -m "Publish DirectML adapter 1 test component"
          git push origin HEAD:agent/directml-ab
