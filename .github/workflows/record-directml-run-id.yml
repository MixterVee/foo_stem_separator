name: Record DirectML adapter run id

on:
  workflow_dispatch:
  push:
    branches: [ agent/directml-ab ]
    paths:
      - '.github/workflows/record-directml-run-id.yml'

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: windows-2022
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Find latest successful NVIDIA adapter build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh run list `
            --repo "${{ github.repository }}" `
            --workflow build-directml-nvidia.yml `
            --branch agent/directml-ab `
            --status success `
            --limit 1 `
            --json databaseId,headSha,createdAt

          $run = $json | ConvertFrom-Json | Select-Object -First 1
          if (-not $run) { throw "No successful NVIDIA adapter build was found." }

          $destDir = "$env:GITHUB_WORKSPACE\deliverables"
          New-Item -ItemType Directory -Force $destDir | Out-Null
          [System.IO.File]::WriteAllText(
            "$destDir\directml-adapter1-run-id.txt",
            [string]$run.databaseId,
            [System.Text.Encoding]::ASCII)

          Write-Host "Recorded run id $($run.databaseId) from commit $($run.headSha)"

      - name: Commit run id
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/directml-adapter1-run-id.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Run id already current."
            exit 0
          }
          git commit -m "Record DirectML adapter 1 workflow run id"
          git push origin HEAD:agent/directml-ab
