name: Finalize Stem 2.6.0 baseline

on:
  push:
    branches: [ main ]
    paths: [ release-cleanup-trigger.txt ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply cleanup script
        shell: pwsh
        run: |
          python .\release_cleanup_260.py
          if ($LASTEXITCODE -ne 0) { throw "Stem 2.6.0 cleanup script failed." }

      - name: Commit clean stable tree
        shell: pwsh
        run: |
          Remove-Item '.github\workflows\release-cleanup-main.yml' -Force
          Remove-Item 'release_cleanup_260.py' -Force
          Remove-Item 'release-cleanup-trigger.txt' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Prepare Stem Separator 2.6.0 stable baseline'
          git push origin HEAD:main
